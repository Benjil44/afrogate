# Afrows backend Germany management (adu/rmu/read-usage).
# PRIMARY: multiplex over the relay master held by afrows-de-relay.service
#          (Ireland -> Borjino -> USA -> Germany).
# FALLBACK: when that master is not up, this block does not match and ssh goes
#          direct to 162.19.253.235 (village wg-village-de route), unchanged.
# Scoped to local user 'afrows' only.
Match localuser afrows host 162.19.253.235 exec "/usr/local/libexec/afrows-de-relay-up"
  ControlMaster no
  ControlPath /run/afrows/de-relay.sock
  ProxyJump 185.252.30.127,93.127.140.50
Match localuser afrows host 185.252.30.127,93.127.140.50
  User afrows-relay
  IdentityFile /etc/afrows/de_relay_key
  IdentitiesOnly yes
  UserKnownHostsFile /etc/afrows/de_relay_known_hosts
  StrictHostKeyChecking yes
  ConnectTimeout 8
  ServerAliveInterval 15
