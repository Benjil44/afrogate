# Afrows -> Hexogate per-country WS entry locations (customer-facing INBOUND side).
#
# Include this INSIDE the `app.afrows.com` :443 server block, next to the existing
#   location /afrowsws { proxy_pass http://127.0.0.1:8447; ... }
# (the main Afrows ws inbound). Each block below is the per-country twin of that one:
# a customer's "Hexo <CC>" entry dials app.afrows.com:443 over TLS+WS on path
# /afrowsws-<cc>, nginx terminates TLS and proxies the WS upgrade to the loopback
# hexo-in-<cc> xray inbound created by scripts/afrows-hexo-egress-sync.py.
#
#   app.afrows.com:443  --TLS-->  nginx  --WS /afrowsws-<cc>-->  127.0.0.1:<port>  (hexo-in-<cc>)
#
# Ports match AFROWS_HEXO_ENTRY_PORTS (the single source of truth shared with the
# reconciler and the backend entry-link builder): DE 8460 .. RO 8466. The ws paths
# match clone_inbound()'s /afrowsws-<cc> (lowercase cc).
#
# Apply (additive, no downtime for existing links):
#   nginx -t && systemctl reload nginx     # reload, NOT restart
#
# These are exact-match (`location =`) so they never shadow /afrowsws or the SPA/api
# locations. listen=127.0.0.1 on the xray side keeps the raw ports off the public
# interface; the only public surface stays :443 TLS, exactly like /afrowsws today.

location = /afrowsws-de {
    proxy_pass http://127.0.0.1:8460;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
}

