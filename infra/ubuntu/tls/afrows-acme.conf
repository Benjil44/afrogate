# /etc/nginx/snippets/afrows-acme.conf: certbot webroot (HTTP-01) for the
# afrows.com / www / app server blocks. Let's Encrypt reaches it through
# Cloudflare -> afrows-cf tunnel (USA) -> reverse tunnel -> this nginx.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
    try_files $uri =404;
}
