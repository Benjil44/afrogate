# /etc/ssh/ssh_config.d/61-afrows-def-mgmt.conf  (on the Afrows backend server)
# Afrows backend -> "Germany Fast x2" exit management (adu / rmu / read-usage).
# Unlike the USA alias (which rides the xray chain via a loopback ProxyCommand), the Germany-Fast
# box is reachable directly, so this alias dials it straight on :22. The key is pinned on the box
# to the forced command /usr/local/sbin/afrows-def-mgmt-cmd with from="<this backend's IP>".
# No Borjino hop. Applies to any local user; the backend runs ssh as 'afrows'.
Host afrows-def-mgmt
  HostName 46.249.98.221
  Port 22
  User root
  IdentityFile /etc/afrows/def_mgmt_key
  IdentitiesOnly yes
  BatchMode yes
  HostKeyAlias afrows-def-mgmt
  UserKnownHostsFile /etc/afrows/def_mgmt_known_hosts
  StrictHostKeyChecking yes
  UpdateHostKeys no
  ConnectTimeout 15
  ServerAliveInterval 15
  ServerAliveCountMax 2
  ControlMaster no
  ForwardAgent no
  ForwardX11 no
  ClearAllForwardings yes
