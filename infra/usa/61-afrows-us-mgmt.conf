# /etc/ssh/ssh_config.d/61-afrows-us-mgmt.conf  (on the Afrows server)
# Afrows backend -> USA exit management (adu / rmu / read-usage). See infra/usa/README.md.
# The session never touches the public internet as SSH: it rides the Afrows xray
# loopback socks inbound us-mgmt-socks (127.0.0.1:1083) -> outbound via-usa
# (VLESS-WS-TLS over Cloudflare, us.afrows.com) -> USA xray -> 127.0.0.1:22 on the USA,
# where the key is pinned to the forced command afrows-us-mgmt-cmd with from="127.0.0.1".
# No Borjino hop. Applies to any local user; the backend runs ssh as 'afrows'.
Host afrows-us-mgmt
  HostName 127.0.0.1
  Port 22
  User root
  ProxyCommand /usr/bin/nc -X 5 -x 127.0.0.1:1083 %h %p
  IdentityFile /etc/afrows/us_mgmt_key
  IdentitiesOnly yes
  BatchMode yes
  HostKeyAlias afrows-us-mgmt
  UserKnownHostsFile /etc/afrows/us_mgmt_known_hosts
  StrictHostKeyChecking yes
  UpdateHostKeys no
  ConnectTimeout 15
  ServerAliveInterval 15
  ServerAliveCountMax 2
  ControlMaster no
  ForwardAgent no
  ForwardX11 no
  ClearAllForwardings yes
